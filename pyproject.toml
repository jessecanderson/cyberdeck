[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "cyberdeck-tui"
version = "0.1.0"
description = "A neon multi-agent terminal interface for local coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jesse Anderson" },
]
keywords = ["ai", "agents", "codex", "terminal", "textual", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/jessecanderson/cyberdeck"
Repository = "https://github.com/jessecanderson/cyberdeck"
Issues = "https://github.com/jessecanderson/cyberdeck/issues"
Releases = "https://github.com/jessecanderson/cyberdeck/releases"

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
]

[project.scripts]
cyberdeck = "cyberdeck.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberdeck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
