[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberdeck-tui"
version = "0.1.0"
description = "A neon multi-agent terminal interface for local coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
cyberdeck = "cyberdeck.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberdeck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
