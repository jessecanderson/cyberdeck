name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/cyberdeck-wheel-test
          /tmp/cyberdeck-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/cyberdeck-wheel-test/bin/cyberdeck --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyberdeck-distributions
          path: dist/
          if-no-files-found: error
