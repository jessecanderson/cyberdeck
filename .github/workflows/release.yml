name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Install release tools
        run: python -m pip install --upgrade pip 'build>=1.5,<2' 'twine>=6.2,<7'
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/cyberdeck-release-test
          /tmp/cyberdeck-release-test/bin/python -m pip install dist/*.whl
          test "$(/tmp/cyberdeck-release-test/bin/cyberdeck --version)" = "cyberdeck ${RELEASE_TAG#v}"
      - name: Generate checksums
        run: (cd dist && sha256sum *) > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; reusing it."
          else
            gh release create "$RELEASE_TAG" dist/* SHA256SUMS --verify-tag --generate-notes --title "Cyberdeck $RELEASE_TAG"
          fi
      - name: Dispatch Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SOURCE_ARCHIVE="cyberdeck_tui-${VERSION}.tar.gz"
          SOURCE_SHA256=$(awk -v archive="$SOURCE_ARCHIVE" '$2 == archive { print $1 }' SHA256SUMS)
          test -n "$SOURCE_SHA256"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${SOURCE_ARCHIVE}"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg source_url "$SOURCE_URL" \
            --arg source_sha256 "$SOURCE_SHA256" \
            '{
              event_type: "cyberdeck_release",
              client_payload: {
                version: $version,
                tag: $tag,
                source_url: $source_url,
                source_sha256: $source_sha256
              }
            }' > "$RUNNER_TEMP/homebrew-dispatch.json"
          gh api \
            --method POST \
            repos/jessecanderson/homebrew-tap/dispatches \
            --input "$RUNNER_TEMP/homebrew-dispatch.json"
