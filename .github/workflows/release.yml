name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Install release tools
        run: python -m pip install --upgrade pip 'build>=1.5,<2' 'twine>=6.2,<7'
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/cyberdeck-release-test
          /tmp/cyberdeck-release-test/bin/python -m pip install dist/*.whl
          test "$(/tmp/cyberdeck-release-test/bin/cyberdeck --version)" = "cyberdeck ${GITHUB_REF_NAME#v}"
      - name: Generate checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --generate-notes --title "Cyberdeck $GITHUB_REF_NAME"
