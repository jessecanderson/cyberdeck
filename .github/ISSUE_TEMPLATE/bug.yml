name: Bug report
description: Report a reproducible Cyberdeck problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private prompts, proprietary source, and personal paths from all logs."
  - type: input
    id: version
    attributes:
      label: Cyberdeck version
      placeholder: "cyberdeck 0.3.4"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python version/install method, runtime, and Codex/Kiro CLI version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include only the smallest relevant sanitized log or protocol shape.
